# Replica of db1 on nas1. The primary's postgresql.auto.conf (copied by pg_basebackup) is read after this file
# and overrides it; primary_conninfo and primary_slot_name live there.
data_directory = '/var/lib/postgresql/18/main'
hba_file = '/etc/pg/pg_hba.conf'
ident_file = '/etc/pg/pg_ident.conf'
listen_addresses = '*'          # the container's network; published on nas1's 127.0.0.1:5433 only
unix_socket_directories = '/var/run/postgresql'

# Must be >= db1's values or the standby refuses to start.
max_connections = 1000
max_worker_processes = 8
max_wal_senders = 10
max_prepared_transactions = 0
max_locks_per_transaction = 64

hot_standby = on
hot_standby_feedback = off            # queries here must not hold back vacuum on db1
max_standby_streaming_delay = 5min
wal_receiver_status_interval = 10s

shared_buffers = 4GB
effective_cache_size = 16GB
maintenance_work_mem = 512MB
huge_pages = off
random_page_cost = 4
wal_level = replica
archive_mode = off                    # db1 archives. After a promotion set this up for this server
max_wal_size = 4GB
checkpoint_completion_target = 0.9
shared_preload_libraries = 'pg_stat_statements'
log_checkpoints = on
log_timezone = 'UTC'
