# Managed by homelab (host_firewall role).
# sshd uses the first value it reads, and drop-ins load in lexical order, so this
# file must sort before 99-archlinux.conf.
# Every LAN login in the 90 days before this change used a key; the only
# password logins came from VMs.
PasswordAuthentication no
KbdInteractiveAuthentication no
