---
# Mirror CrowdSec local bans (web2, web3, ...) into Cloudflare account IP Lists. Runs on hv1.
#
crowdsec_cf_sync_dry_run: true         # log only; set false once the logged output looks right
crowdsec_cf_sync_interval: 60s
crowdsec_cf_sync_max_add: 500          # per target per run
crowdsec_cf_sync_max_items: 9000       # free-plan list limit is 10,000

# LAPIs to read. Key: vault_crowdsec_lapi_keys[<name>].
crowdsec_cf_sync_lapis: []
#  - { name: web2, url: "http://10.50.150.11:8080" }

# Cloudflare accounts to push to. Token: vault_cloudflare_lists_tokens[<name>], an API
# token with only Account > Account Filter Lists > Edit. A target without a token file only logs.
crowdsec_cf_sync_targets: []
#  - { name: example-net, account_id: "<32 hex>", list_name: homelab_bans }

# Never pushed, whatever a VM reports: trusted ranges, edge1, and Cloudflare itself.
# Private/reserved addresses are dropped by the script anyway.
crowdsec_cf_sync_never: "{{ homelab_trusted_cidrs + ['203.0.113.10/32'] + crowdsec_cf_sync_cloudflare_ranges }}"
# https://www.cloudflare.com/ips/
crowdsec_cf_sync_cloudflare_ranges:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
